# Deploys the site to InfinityFree (lttethnic.com) over FTP every time
# something is pushed or merged into `main`.
#
# On InfinityFree each domain has its own folder: /lttethnic.com/htdocs/.
# The whole Laravel project lives there; the .htaccess in that folder
# (already on the server, not in this repo) sends visitors to /public and
# blocks access to the code folders.
#
# Only changed files are uploaded. The live database, .env, vendor/,
# storage/ and uploaded photos (public/storage) are never touched.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CSS and JS (public/build)
        run: |
          npm ci
          npm run build

      - name: Upload changed files to lttethnic.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /lttethnic.com/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            vendor/**
            storage/**
            public/storage/**
            public/hot
            public/index.php
            public/.htaccess
            .htaccess
            .env
            .env.*
            database/database.sqlite
            database/*.stale
            tests/**
            deploy_v2/**
            deploy_infinityfree/**
            upload_to_infinityfree/**
            Claude outputs/**
            .claude/**
            .agents/**
            .codex/**
            *.zip
            *.md
            app.yaml
            wasmer.toml
            phpunit.xml
            package.json
            package-lock.json
            vite.config.js
            .mcp.json
            boost.json
            .editorconfig
            .npmrc
            .phpunit.result.cache
            reel_*
            start_server.command
