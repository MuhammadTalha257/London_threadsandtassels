# Deploys the site to InfinityFree (lttethnic.com) over FTP every time
# something is pushed or merged into `main`.
#
# The live site uses a split layout:
#   /laravel_core/  the Laravel app (code, vendor, .env, storage)
#   /htdocs/        the public web root (index.php, build/, images/, storage/)
# htdocs/index.php is a custom file that points at ../laravel_core, so it is
# never overwritten.
#
# Only changed files are uploaded. The live database, .env, vendor/,
# storage/ and uploaded photos are never touched.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CSS and JS (public/build)
        run: |
          npm ci
          npm run build

      - name: Upload app code to /laravel_core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /laravel_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            public/**
            vendor/**
            storage/**
            .env
            .env.*
            database/database.sqlite
            database/*.stale
            tests/**
            deploy_v2/**
            deploy_infinityfree/**
            upload_to_infinityfree/**
            Claude outputs/**
            .claude/**
            .agents/**
            .codex/**
            *.zip
            *.md
            app.yaml
            wasmer.toml
            phpunit.xml
            package.json
            package-lock.json
            vite.config.js
            .mcp.json
            boost.json
            .editorconfig
            .npmrc
            .phpunit.result.cache
            reel_*
            start_server.command

      - name: Upload public files to /htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: /htdocs/
          exclude: |
            index.php
            .htaccess
            storage/**
            hot
            hot.*
